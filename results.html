<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TravelTix{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="{{ url_for('home') }}">🚌🚆 TravelTix</a>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('my_tickets') }}">My Tickets</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>&copy; {{ 2026 }} TravelTix &mdash; Deployed by {{ owner }}</p>
  </footer>
</body>
</html>
